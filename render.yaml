services:
  - type: web
    name: patitas-chile-tienda
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn portal_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "admin@patitaschile.cl"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "admin12345"

